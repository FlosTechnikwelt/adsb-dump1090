  <body>
    <nav class="navbar navbar-expand-lg navbar-dark desy-blue-bg">
      <div class="container-fluid">
        <a class="navbar-brand text-haevy" href="/"
          >DESY Flugzeug-Tracker<span class="text-yellow">.</span></a
        >
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="/">Live-Karte</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/statistics.html">Statistiken</a>

            <li class="nav-item">
              <a class="nav-link" href="/search">Flugsuche</a>
            </li>
          </ul>
        </div>
      </div>

    <div id="map"></div>

    <div class="toast">
      <div class="toast-content">
        <i class="fas fa-solid fa-check check icon"></i>
        <i class="fas fa-solid fa-xmark error icon"></i>
        <i class="fas fa-solid fa-info-circle info icon"></i>
        <div class="message">
          <span class="text toast-message"></span>
        </div>
      </div>
      <i class="fa-solid fa-xmark close"></i>
      <div class="progress"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>
    <script src="assets/js/script.js"></script>
    <footer class="footer">
      <div class="container-fluid">
        <div class="row align-items-center">

            >

                class="helmholtz-logo"
