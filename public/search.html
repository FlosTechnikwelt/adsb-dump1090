  <body class="scrollable">
    <nav class="navbar navbar-expand-lg navbar-dark desy-blue-bg">
      <div class="container-fluid">
        <a class="navbar-brand text-haevy" href="/"
          >DESY Flugzeug-Tracker<span class="text-yellow">.</span></a
        >
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/">Live-Karte</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/statistics.html">Statistiken</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/search">Flugsuche</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <h1 class="mb-4">Nach Flugverlauf suchen</h1>

      <!-- Search Form -->
      <form id="search-form" class="row g-3 mb-4">
        <div class="col-md-5">
          <label for="flight-number" class="form-label"
            >Flugnummer (z.B. DLH2LC)</label
          >
          <input type="text" class="form-control" id="flight-number" required />
        </div>
        <div class="col-md-5">
          <label for="flight-date" class="form-label">Datum</label>
          <input type="date" class="form-control" id="flight-date" required />
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Suchen</button>
        </div>
      </form>

      <!-- Results -->
      <div id="results-container" class="d-none">
        <h2 id="results-heading"></h2>
        <div class="row">
          <!-- Map -->
          <div class="col-lg-8">
            <div id="map" style="height: 500px"></div>
          </div>
          <!-- Details -->
          <div class="col-lg-4" style="max-height: 500px; overflow-y: auto">
            <h4>Flugdatenpunkte</h4>
            <div id="flight-details"></div>
          </div>
        </div>
      </div>
      <div id="no-results" class="alert alert-warning d-none" role="alert">
        Keine Ergebnisse für diese Suche gefunden.
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/search.js"></script>
